<div class="login-container">

  <div class="login-card">

    <!-- HEADER -->
    <div class="login-header">

      <div class="logo">
        SMS
      </div>

      <h2>Welcome Back</h2>

      <p>Sign in to your Student Management System</p>

    </div>


    <!-- LOGIN FORM -->
    <form
      (ngSubmit)="onLogin(loginForm)"
      #loginForm="ngForm"
      novalidate
    >

      <!-- EMAIL -->
      <div class="form-group">

        <label for="email">Email Address</label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          (ngModelChange)="clearError()"
          placeholder="Enter your email"
          required
          email
          autocomplete="username"
          #emailField="ngModel"
          [class.invalid-input]="emailField.invalid && emailField.touched"
        >

        <!-- Required -->
        <small
          class="validation-error"
          *ngIf="emailField.errors?.['required'] && emailField.touched"
        >
          Email address is required.
        </small>

        <!-- Invalid email -->
        <small
          class="validation-error"
          *ngIf="emailField.errors?.['email'] && emailField.touched"
        >
          Please enter a valid email address.
        </small>

      </div>


      <!-- PASSWORD -->
      <div class="form-group">

        <label for="password">Password</label>

        <div
          class="password-wrapper"
          [class.invalid-input]="passwordField.invalid && passwordField.touched"
        >

          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            [(ngModel)]="password"
            (ngModelChange)="clearError()"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
            #passwordField="ngModel"
          >

          <!-- ANGULAR MATERIAL ICON -->
          <button
            type="button"
            class="password-toggle"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="showPassword"
            tabindex="0"
          >

            <mat-icon>
              {{ showPassword ? 'visibility_off' : 'visibility' }}
            </mat-icon>

          </button>

        </div>

        <!-- Password required -->
        <small
          class="validation-error"
          *ngIf="passwordField.errors?.['required'] && passwordField.touched"
        >
          Password is required.
        </small>

      </div>


      <!-- LOGIN ERROR -->
      <div
        class="error-message"
        *ngIf="errorMessage"
        role="alert"
        aria-live="assertive"
      >

        <mat-icon>error_outline</mat-icon>

        <span>{{ errorMessage }}</span>

      </div>


      <!-- LOGIN BUTTON -->
      <button
        type="submit"
        class="login-btn"
        [disabled]="isLoading"
      >

        <ng-container *ngIf="!isLoading">
          Login
        </ng-container>

        <ng-container *ngIf="isLoading">

          <span class="spinner"></span>

          Signing in...

        </ng-container>

      </button>

    </form>


    <!-- FOOTER -->
    <div class="login-footer">

      <p>
        Don't have an account?

        <a routerLink="/signup">
          Create Account
        </a>
      </p>

    </div>

  </div>

</div>
