<div class="student-dashboard">

  <!-- DASHBOARD HEADER -->

  <section class="welcome-section">

    <div class="welcome-text">

      <span class="section-label">
        STUDENT PORTAL
      </span>

      <h1>
        Dashboard
      </h1>

      <p>
        Here's an overview of your academic performance.
      </p>

    </div>

  </section>


  <!-- LOADING -->

  <div class="loading-message" *ngIf="isLoading">

    Loading your dashboard...

  </div>


  <!-- ERROR MESSAGES -->

  <div class="error-message" *ngIf="!isLoading && attendanceError">

    {{ attendanceError }}

  </div>

  <div class="error-message" *ngIf="!isLoading && marksError">

    {{ marksError }}

  </div>


  <!-- SUMMARY CARDS -->

  <section class="summary-grid" *ngIf="!isLoading">

    <!-- TOTAL SUBJECTS -->

    <div class="summary-card">

      <div class="summary-icon purple">
        <span>📚</span>
      </div>

      <div>

        <p>Total Subjects</p>

        <h2>{{ totalSubjects }}</h2>

      </div>

    </div>


    <!-- TOTAL CLASSES -->

    <div class="summary-card">

      <div class="summary-icon blue">
        <span>📅</span>
      </div>

      <div>

        <p>Total Classes</p>

        <h2>{{ totalClasses }}</h2>

      </div>

    </div>


    <!-- AVERAGE MARKS -->

    <div class="summary-card">

      <div class="summary-icon green">
        <span>🏆</span>
      </div>

      <div>

        <p>Average Marks</p>

        <h2>{{ averageMarks }}%</h2>

      </div>

    </div>

  </section>

</div>
