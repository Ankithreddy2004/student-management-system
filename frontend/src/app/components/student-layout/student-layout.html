<div class="dashboard-layout">

  <!-- =====================================
       TOP HEADER
  ====================================== -->

  <header class="main-header">

    <!-- BRAND -->

    <div class="header-brand">

      <div class="logo">
        SMS
      </div>

      <div class="brand-info">

        <h2>Student Management System</h2>

        <p>Student Portal</p>

      </div>

    </div>


    <!-- PROFILE AND LOGOUT -->

    <div class="header-actions">

      <a
        routerLink="/student/profile"
        class="header-profile">

        <div class="header-avatar">

          <mat-icon>person</mat-icon>

        </div>

        <div class="header-profile-info">

          <h3>{{ studentName || 'Student' }}</h3>

          <p>Student</p>

        </div>

      </a>


      <button
        class="header-logout-btn"
        (click)="logout()">

        <mat-icon>logout</mat-icon>

        <span>Logout</span>

      </button>

    </div>

  </header>


  <!-- =====================================
       BODY LAYOUT
  ====================================== -->

  <div class="dashboard-body">

    <!-- STUDENT SIDEBAR -->

    <aside class="student-sidebar">

      <nav class="sidebar-nav">

        <!-- DASHBOARD -->

        <a
          routerLink="/student/dashboard"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }">

          <mat-icon>dashboard</mat-icon>

          <span>Dashboard</span>

        </a>


        <!-- ATTENDANCE -->

        <a
          routerLink="/student/attendance"
          routerLinkActive="active">

          <mat-icon>event_available</mat-icon>

          <span>My Attendance</span>

        </a>


        <!-- MARKS -->

        <a
          routerLink="/student/marks"
          routerLinkActive="active">

          <mat-icon>grading</mat-icon>

          <span>My Marks</span>

        </a>

        <!-- SUBJECT ENROLLMENT -->

        <a routerLink="/student/subjects"
          routerLinkActive="active">
          <mat-icon>library_books</mat-icon><span>Subject Enrollment</span></a>

        <!-- PROFILE -->

        <a
          routerLink="/student/profile"
          routerLinkActive="active">

          <mat-icon>person</mat-icon>

          <span>Edit Profile</span>

        </a>

      </nav>


      <!-- SIDEBAR FOOTER -->

      <div class="sidebar-footer">

        <p>Student Management System</p>

        <span>Student Access</span>

      </div>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="dashboard-main">

      <section class="dashboard-content">

        <router-outlet></router-outlet>

      </section>

    </main>

  </div>

</div>
